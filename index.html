<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Gift Olish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 5px;
            color: var(--tg-theme-link-color, #2481cc);
        }
        p {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }
        .options-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }
        .card.active {
            border-color: var(--tg-theme-button-color, #2481cc);
            background-color: rgba(36, 129, 204, 0.05);
        }
        .card-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon {
            font-size: 24px;
        }
        .title {
            font-weight: bold;
            font-size: 15px;
        }
        .price {
            font-weight: bold;
            font-size: 15px;
            color: var(--tg-theme-button-color, #2481cc);
        }
    </style>
</head>
<body>

    <h2>🎁 Telegram Gifts</h2>
    <p>O'zingizga ma'qul sovg'ani tanlang:</p>

    <div class="options-container">
        <div class="card active" onclick="selectGift('Delicious Cake', 15, '🎂', this)">
            <div class="card-info">
                <span class="icon">🎂</span>
                <span class="title">Delicious Cake</span>
            </div>
            <span class="price">15 Stars</span>
        </div>

        <div class="card" onclick="selectGift('Green Star', 25, '⭐️', this)">
            <div class="card-info">
                <span class="icon">⭐️</span>
                <span class="title">Green Star</span>
            </div>
            <span class="price">25 Stars</span>
        </div>

        <div class="card" onclick="selectGift('Teddy Bear', 50, '🧸', this)">
            <div class="card-info">
                <span class="icon">🧸</span>
                <span class="title">Teddy Bear</span>
            </div>
            <span class="price">50 Stars</span>
        </div>

        <div class="card" onclick="selectGift('Golden Ring', 100, '💍', this)">
            <div class="card-info">
                <span class="icon">💍</span>
                <span class="title">Golden Ring</span>
            </div>
            <span class="price">100 Stars</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedGift = {
            name: 'Delicious Cake',
            stars: 15
        };

        tg.MainButton.setText(`SOVG'A OLISH (15 STARS)`);
        tg.MainButton.show();

        function selectGift(name, stars, icon, element) {
            document.querySelectorAll('.card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            selectedGift = { name, stars };
            tg.MainButton.setText(`SOVG'A OLISH (${stars} STARS)`);
        }

        tg.MainButton.onClick(function() {
            const data = {
                type: 'gift',
                gift_name: selectedGift.name,
                stars: selectedGift.stars,
                username: tg.initDataUnsafe?.user?.username || "Noma'lum"
            };
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
