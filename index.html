<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Olish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .price-box {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⭐️ Telegram Stars Olish</h2>
        <p>Qancha Stars kerakligini kiriting:</p>

        <input type="number" id="starsInput" placeholder="Masalan: 100" value="50" min="1" oninput="calculatePrice()">

        <div class="price-box">
            Jami summa: <span id="totalPrice">0</span> so'm
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const STAR_PRICE = 270; // 1 Stars narxi (so'mda)

        function calculatePrice() {
            const stars = parseInt(document.getElementById('starsInput').value) || 0;
            const total = stars * STAR_PRICE;
            document.getElementById('totalPrice').innerText = total.toLocaleString();

            if (stars > 0) {
                tg.MainButton.setText(`SOTIB OLISH (${total.toLocaleString()} SO'M)`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        calculatePrice();

        tg.MainButton.onClick(function() {
            const stars = parseInt(document.getElementById('starsInput').value) || 0;
            const total = stars * STAR_PRICE;

            const data = {
                type: 'stars',
                stars: stars,
                total: total,
                username: tg.initDataUnsafe?.user?.username || "Noma'lum"
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
