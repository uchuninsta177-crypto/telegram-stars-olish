<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Olish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input {
            width: 90%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: white;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⭐️ Telegram Stars Xarid Qilish</h2>
    
    <div class="card">
        <label for="username_input">Qabul qiluvchi Username:</label><br><br>
        <input type="text" id="username_input" placeholder="@username">
    </div>

    <div class="card">
        <h3>50 Stars</h3>
        <p>Narxi: 11,000 so'm</p>
        <button class="btn" onclick="buyStars(50, 11000)">Sotib olish</button>
    </div>

    <div class="card">
        <h3>100 Stars</h3>
        <p>Narxi: 22,000 so'm</p>
        <button class="btn" onclick="buyStars(100, 22000)">Sotib olish</button>
    </div>

    <div class="card">
        <h3>250 Stars</h3>
        <p>Narxi: 55,000 so'm</p>
        <button class="btn" onclick="buyStars(250, 55000)">Sotib olish</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function buyStars(starsCount, totalPriceSom) {
        let usernameInput = document.getElementById('username_input').value.trim();

        if (!usernameInput) {
            alert("Iltimos, username-ni kiriting!");
            return;
        }

        let dataToSend = {
            stars: parseInt(starsCount),
            total: parseInt(totalPriceSom),
            username: usernameInput
        };

        // Telegram Botga ma'lumot yuboramiz
        tg.sendData(JSON.stringify(dataToSend));
    }
</script>

</body>
</html>
