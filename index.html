<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Olish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #18181c;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a30;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 22px;
            color: #ffb703;
        }

        .balance-box {
            background: #222228;
            border: 1px solid #33333d;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .balance-amount {
            color: #2ec4b6;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .username-wrapper {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #33333d;
            background: #222228;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0088cc;
        }

        .myself-btn {
            background: #2a2a35;
            color: #0088cc;
            border: 1px solid #0088cc;
            border-radius: 12px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .myself-btn:active {
            transform: scale(0.95);
        }

        .star-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .star-btn {
            background: #222228;
            border: 1px solid #33333d;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .star-btn:hover {
            background: #2a2a35;
            border-color: #ffb703;
        }

        .error-text {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .total-price {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            color: #2ec4b6;
        }

        .buy-btn {
            width: 100%;
            background: #0088cc;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⭐️ Telegram Stars Olish</h2>

    <!-- Display Balance -->
    <div class="balance-box">
        Mavjud balans: <span class="balance-amount" id="userBalanceDisplay">0 so'm</span>
    </div>

    <!-- Username Input -->
    <div class="input-group">
        <label for="username">Qabul qiluvchi Username:</label>
        <div class="username-wrapper">
            <input type="text" id="username" placeholder="@username">
            <button type="button" class="myself-btn" id="myself">O'zimga</button>
        </div>
    </div>

    <!-- Rapid Selection Buttons -->
    <label>Tezkor tanlash:</label>
    <div class="star-buttons">
        <button class="star-btn" data-stars="50">50</button>
        <button class="star-btn" data-stars="100">100</button>
        <button class="star-btn" data-stars="250">250</button>
        <button class="star-btn" data-stars="500">500</button>
        <button class="star-btn" data-stars="1000">1000</button>
        <button class="star-btn" data-stars="2500">2500</button>
    </div>

    <!-- Custom Stars Input -->
    <div class="input-group">
        <label for="customStars">Stars miqdori:</label>
        <input type="number" id="customStars" placeholder="Masalan: 100" min="50" max="10000">
        <div class="error-text" id="errorText"></div>
    </div>

    <!-- Total Price Display -->
    <div class="total-price" id="totalPrice">Jami: 0 so'm</div>

    <!-- Purchase Button -->
    <button class="buy-btn" id="buyBtn" disabled>Sotib olish</button>
</div>

<script>
    const PRICE_PER_STAR = 225;
    const MIN_STARS = 50;
    const MAX_STARS = 10000;

    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const userBalance = parseInt(urlParams.get('balance'), 10) || 0;

    // Elements
    const usernameInput = document.getElementById("username");
    const starsInput = document.getElementById("customStars");
    const totalPriceEl = document.getElementById("totalPrice");
    const buyBtn = document.getElementById("buyBtn");
    const errorText = document.getElementById("errorText");
    const balanceDisplay = document.getElementById("userBalanceDisplay");
    const starButtons = document.querySelectorAll(".star-btn");
    const myselfBtn = document.getElementById("myself");

    // Display user balance
    balanceDisplay.innerText = userBalance.toLocaleString() + " so'm";

    function checkForm() {
        let rawUsername = usernameInput.value.trim();
        let stars = parseInt(starsInput.value, 10) || 0;
        let totalPrice = stars * PRICE_PER_STAR;

        let hasError = false;

        if (stars > 0 && stars < MIN_STARS) {
            showError(`❌ Minimum ${MIN_STARS} Stars kiriting`);
            hasError = true;
        } else if (stars > MAX_STARS) {
            showError(`❌ Maksimum ${MAX_STARS} Stars mumkin`);
            hasError = true;
        } else if (totalPrice > userBalance && stars >= MIN_STARS) {
            showError("❌ Balansingizda mablag' yetarli emas!");
            hasError = true;
        } else {
            hideError();
        }

        // Validate complete setup
        if (!hasError && rawUsername !== "" && stars >= MIN_STARS && stars <= MAX_STARS) {
            buyBtn.disabled = false;
            buyBtn.style.opacity = "1";
        } else {
            buyBtn.disabled = true;
            buyBtn.style.opacity = "0.5";
        }

        totalPriceEl.innerText = "Jami: " + totalPrice.toLocaleString() + " so'm";
    }

    function showError(msg) {
        errorText.style.display = "block";
        errorText.innerText = msg;
        starsInput.style.color = "#ff4d4d";
    }

    function hideError() {
        errorText.style.display = "none";
        errorText.innerText = "";
        starsInput.style.color = "#ffffff";
    }

    // Event listeners
    usernameInput.addEventListener("input", () => {
        let val = usernameInput.value.trim();
        if (val.length > 0 && !val.startsWith("@")) {
            usernameInput.value = "@" + val;
        }
        checkForm();
    });

    starsInput.addEventListener("input", checkForm);

    starButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            let stars = parseInt(btn.getAttribute("data-stars"), 10);
            starsInput.value = stars;
            checkForm();
        });
    });

    myselfBtn.addEventListener("click", () => {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            if (user.username) {
                usernameInput.value = "@" + user.username;
            } else {
                usernameInput.value = "ID: " + user.id;
            }
            checkForm();
        } else {
            alert("Telegram ma'lumotlari topilmadi!");
        }
    });

    buyBtn.addEventListener("click", () => {
        let username = usernameInput.value.trim();
        let stars = parseInt(starsInput.value, 10);
        let totalPrice = stars * PRICE_PER_STAR;
        let userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;

        if (totalPrice > userBalance) {
            alert("Balansingizda mablag' yetarli emas!");
            return;
        }

        const order = {
            user_id: userId,
            target_username: username,
            stars: stars,
            total_price: totalPrice
        };

        if (tg && tg.sendData) {
            tg.sendData(JSON.stringify(order));
            tg.close();
        } else {
            alert("Ushbu funksiya faqat Telegram Mini App ichida ishlaydi.");
        }
    });
</script>

</body>
</html>
