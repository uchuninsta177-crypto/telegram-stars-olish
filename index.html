<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Olish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #18181c;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a30;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            color: #ffb703;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .username-wrapper {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #33333d;
            background: #222228;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0088cc;
        }

        .myself-btn {
            background: #2a2a35;
            color: #0088cc;
            border: 1px solid #0088cc;
            border-radius: 12px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .myself-btn:active {
            transform: scale(0.95);
        }

        .star-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .star-btn {
            background: #222228;
            border: 1px solid #33333d;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .star-btn:hover {
            background: #2a2a35;
            border-color: #ffb703;
        }

        .error-text {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .total-price {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            color: #2ec4b6;
        }

        .buy-btn {
            width: 100%;
            background: #0088cc;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⭐️ Telegram Stars Olish</h2>

    <!-- Username Input -->
    <div class="input-group">
        <label for="username">Qabul qiluvchi Username:</label>
        <div class="username-wrapper">
            <input type="text" id="username" placeholder="@username">
            <button type="button" class="myself-btn" id="myself">O'zimga</button>
        </div>
    </div>

    <!-- Rapid Selection Buttons -->
    <label>Tezkor tanlash:</label>
    <div class="star-buttons">
        <button class="star-btn">50</button>
        <button class="star-btn">100</button>
        <button class="star-btn">250</button>
        <button class="star-btn">500</button>
        <button class="star-btn">1000</button>
        <button class="star-btn">2500</button>
    </div>

    <!-- Custom Stars Input -->
    <div class="input-group">
        <label for="customStars">Stars miqdori:</label>
        <input type="number" id="customStars" placeholder="Masalan: 100" min="50" max="10000">
        <div class="error-text" id="errorText"></div>
    </div>

    <!-- Total Price Display -->
    <div class="total-price" id="totalPrice">Jami: 0 so'm</div>

    <!-- Purchase Button -->
    <button class="buy-btn" id="buyBtn">Sotib olish</button>
</div>

<script>
    const price = 225;

    // URL parametridan 'balance' qiymatini o'qib olamiz
    const urlParams = new URLSearchParams(window.location.search);
    const userBalance = parseInt(urlParams.get('balance')) || 0;

    const buttons = document.querySelectorAll(".star-btn");
    const total = document.getElementById("totalPrice");
    const input = document.getElementById("customStars");
    const buyBtn = document.getElementById("buyBtn");
    const errorText = document.getElementById("errorText");

    buyBtn.disabled = true;
    buyBtn.style.opacity = "0.5";

    document.getElementById("username").oninput = checkForm;

    buttons.forEach(btn => {
        btn.onclick = () => {
            let stars = Number(btn.innerText);

            input.value = stars;
            input.style.color = "white";

            errorText.style.display = "none";
            errorText.innerText = "";

            total.innerText = "Jami: " + (stars * price).toLocaleString() + " so'm";

            checkForm();
        };
    });

    input.oninput = () => {
        let stars = parseInt(input.value) || 0;

        if (stars < 50) {
            input.style.color = "#ff4d4d";
            errorText.style.display = "block";
            errorText.innerText = "❌ Minimum 50 Stars kiriting";
        } else if (stars > 10000) {
            input.style.color = "#ff4d4d";
            errorText.style.display = "block";
            errorText.innerText = "❌ Maksimum 10000 Stars mumkin";
        } else {
            input.style.color = "white";
            errorText.style.display = "none";
        }

        total.innerText = "Jami: " + (stars * price).toLocaleString() + " so'm";

        checkForm();
    };

    function checkForm() {
        let username = document.getElementById("username").value.trim();
        let stars = Number(input.value);
        let totalPrice = stars * price;

        if (username !== "" && stars >= 50 && stars <= 10000) {
            if (totalPrice > userBalance) {
                errorText.style.display = "block";
                errorText.innerText = "❌ Balansingizda mablag' yetarli emas!";
                buyBtn.disabled = true;
                buyBtn.style.opacity = "0.5";
            } else {
                errorText.style.display = "none";
                buyBtn.disabled = false;
                buyBtn.style.opacity = "1";
            }
        } else {
            buyBtn.disabled = true;
            buyBtn.style.opacity = "0.5";
        }
    }

    const tg = window.Telegram ? window.Telegram.WebApp : null;

    document.getElementById("myself").onclick = () => {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username) {
            document.getElementById("username").value = "@" + tg.initDataUnsafe.user.username;
            checkForm();
        } else {
            alert("Username topilmadi!");
        }
    };

    buyBtn.onclick = async () => {
        let username = document.getElementById("username").value.trim();
        let stars = Number(input.value);
        let totalPrice = stars * price;
        let userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;

        if (totalPrice > userBalance) {
            alert("Balansingizda mablag' yetarli emas! Iltimos, balansingizni to'ldiring.");
            return;
        }

        const order = {
            user_id: userId,
            username: username,
            stars: stars,
            total: totalPrice
        };

        // Telegram Botga ma'lumotni yuborish
        if (tg && tg.sendData) {
            tg.sendData(JSON.stringify(order));
        }

        // Serverga POST so'rov yuborish
        try {
            const response = await fetch("https://telegram-stars-olish.onrender.com/order", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(order)
            });

            const result = await response.json();
            alert(result.message || "Buyurtma qabul qilindi!");

        } catch (e) {
            alert("Buyurtmangiz botga yuborildi!");
        }
    };
</script>

</body>
</html>
